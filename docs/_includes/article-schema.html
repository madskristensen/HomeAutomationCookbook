{% assign article_image = page.image | default: "/assets/img/hero.jpg" | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "@id": {{ page.url | append: "#article" | absolute_url | jsonify }},
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "image": {{ article_image | jsonify }},
  {% if page.date %}"datePublished": {{ page.date | date_to_xmlschema | jsonify }},{% endif %}
  "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},
  "isPartOf": {
    "@id": {{ "/#website" | absolute_url | jsonify }}
  },
  "author": {
    "@type": "Person",
    "@id": {{ "/about.html#person" | absolute_url | jsonify }},
    "name": {{ site.author.name | jsonify }},
    "url": {{ "/about.html" | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "@id": {{ "/#organization" | absolute_url | jsonify }},
    "name": {{ site.title | jsonify }},
    "url": {{ "/" | absolute_url | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "@id": {{ "/#logo" | absolute_url | jsonify }},
      "url": {{ "/assets/img/icon-512x512.png" | absolute_url | jsonify }}
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ page.url | absolute_url | jsonify }}
  }
}
</script>
