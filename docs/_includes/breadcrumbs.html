{% unless page.url == "/" %}
{% include breadcrumb-data.html %}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="/">Home</a>
  {% if ancestor_name %}
    <span aria-hidden="true">/</span>
    <a href="{{ ancestor_url | relative_url }}">{{ ancestor_name }}</a>
  {% endif %}
  {% if category_name %}
    <span aria-hidden="true">/</span>
    <a href="{{ category_url | relative_url }}">{{ category_name }}</a>
  {% endif %}
  <span aria-hidden="true">/</span>
  <span class="breadcrumb-current" aria-current="page">{{ page.title }}</span>
</nav>
{% endunless %}
