# Home Automation Cookbook
# Documentation Jekyll configuration

# Site settings
title: Home Automation Cookbook
description: >-
  Practical, family-first home automation recipes with plain-English logic,
  working physical controls, and honest notes about firsthand experience.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://www.homeautomationcookbook.com" # the base hostname & protocol for your site
repository: madskristensen/HomeAutomationCookbook

# Open Graph / Social Sharing (used by jekyll-seo-tag)
# Default image for social sharing when pages don't specify their own
defaults:
  - scope:
      path: ""
    values:
      image: https://www.homeautomationcookbook.com/assets/img/hero.jpg
  - scope:
      path: "automation"
    values:
      seo:
        type: WebPage

twitter:
  username: madskristensen
  card: summary_large_image
social:
  name: Home Automation Cookbook
  links:
    - https://github.com/madskristensen/HomeAutomationCookbook

# Author information (for schema.org)
author:
  name: Mads Kristensen
  twitter: madskristensen
  url: https://www.homeautomationcookbook.com/about.html

# Build settings
markdown: kramdown
theme: jekyll-theme-cayman

collections:
  articles:
    output: true
    permalink: /articles/:name.html

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
# Navigation
navigation:
  - title: Getting started
    url: /getting-started/index.html
    subitems:
      - title: Philosophy
        url: /getting-started/philosophy.html
      - title: Choose the right platform
        url: /getting-started/choose-the-right-platform.html
      - title: Choose devices and gear
        url: /getting-started/device-guide.html
      - title: Tips and tricks
        url: /getting-started/tips.html
      - title: Resources
        url: /getting-started/resources.html
  - title: Platforms
    url: /platforms/index.html
    subitems:
      - title: Amazon Alexa
        url: /platforms/alexa.html
      - title: SmartThings
        url: /platforms/smartthings.html
      - title: Hubitat
        url: /platforms/hubitat.html
      - title: Home Assistant
        url: /platforms/home-assistant.html
  - title: Automations
    url: /automation/index.html
    subitems:
      - title: Lighting
        url: /automation/lighting/index.html
      - title: Daily routines
        url: /automation/daily-routines/index.html
      - title: Climate and comfort
        url: /automation/climate/index.html
      - title: Entertainment
        url: /automation/entertainment/index.html
      - title: Appliances
        url: /automation/appliances/index.html
      - title: Safety and security
        url: /automation/security/index.html
      - title: Notifications and alerts
        url: /automation/notifications/index.html
  - title: Articles
    url: /articles/index.html
  - title: FAQ
    url: /faq/index.html
  - title: About
    url: /about.html

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-minifier

# Minification settings
# Automatically minifies HTML, CSS, and JavaScript during build
jekyll-minifier:
  compress_css: true
  compress_javascript: true
  compress_json: true
  compress_html: true
  uglifier_args:
    harmony: true
  remove_comments: true
  remove_intertag_spaces: true
  remove_quotes: false
  simple_doctype: false
  preserve_line_breaks: false

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
