presence:
  title: Presence recipes for arriving and leaving
  heading: Recipes that react when people come and go
  description: Recipes that act when the house becomes empty or someone comes home, like away mode, arrival lights, and running the vacuum.
  intro: These recipes react to who is home. They run when the last person leaves or when someone arrives. Presence signals can be wrong, so each recipe explains how to confirm the house is really empty and what happens if someone comes back early.
