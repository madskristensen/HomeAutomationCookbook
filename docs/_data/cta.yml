# Per-category newsletter CTA copy. The free PDF (10 starter recipes) is the hook.
# pdf_note: one line on what the 10 include for this category. Only list recipes that are really in the PDF:
# wake-up-lights, lights-on-motion, lights-off-after-motion, toggle-lights-door, fake-dog-deterrent,
# garage-door-notification, stove-left-on-alert, fridge-door-alert, away-mode, morning-routine.
# Page front matter can override with cta_newsletter. Articles can set cta_category.
# shop_card: per-topic line for the printable recipe cards promo. The cards are ONE set of all 61 recipes
# (see /shop/). There are no per-category packs, so never imply the cards hold only this topic.
# Page front matter can override with cta_shop.
