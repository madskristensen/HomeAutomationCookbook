  </style><rect width="1200" height="630" fill="#f8f9fa" /><rect x="52" y="52" width="1096" height="526" rx="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" /><text x="105" y="175" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700">Hubitat</text><text x="108" y="232" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="30">A small managed hub with deep local control</text><text x="108" y="335" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Fast for daily life. Open when needed.</text><text x="108" y="381" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="23">Built-in apps, webCoRE, community drivers,</text><text x="108" y="415" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="23">and room for custom code.</text><g transform="translate(680 115)" fill="none" stroke="#2c3e50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="82" y="145" width="270" height="150" rx="24" fill="#eef2f3" /><rect x="120" y="184" width="194" height="72" rx="12" fill="#ffffff" /><circle cx="282" cy="220" r="9" fill="#6f8f96" stroke="none" /><path d="M217 145V68M82 220H6M352 220h78M217 295v80" stroke="#9db1b6" stroke-width="5" /><circle cx="217" cy="52" r="12" fill="#6f8f96" stroke="none" /><circle cx="-10" cy="220" r="12" fill="#6f8f96" stroke="none" /><circle cx="446" cy="220" r="12" fill="#6f8f96" stroke="none" /><circle cx="217" cy="391" r="12" fill="#6f8f96" stroke="none" /></g><g transform="translate(675 430)" font-family="Consolas, monospace" font-size="21" font-weight="700"><rect width="104" height="48" rx="12" fill="#2c3e50" /><text x="30" y="31" fill="#ffffff">IF</text><path d="M115 24h42" stroke="#9db1b6" stroke-width="4" /><rect x="168" width="120" height="48" rx="12" fill="#6f8f96" /><text x="189" y="31" fill="#ffffff">THEN</text><path d="M299 24h42" stroke="#9db1b6" stroke-width="4" /><rect x="352" width="104" height="48