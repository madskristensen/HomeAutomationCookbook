<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Hubitat home automation guide</title><desc id="desc">A compact local hub connects devices and conditional automation blocks.</desc><style>
