<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Control lights with a wireless button or linked switch</title><desc id="desc">A wireless button or wall switch sends predictable on and off commands to several lights.</desc><style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#f8f9fa"] { fill: #14191c; }
      rect[fill="#ffffff"], path[fill="#ffffff"] { fill: #1d2428; }
      [fill="#eef2f3"] { fill: #293238; }
      text[fill="#2c3e50"] { fill: #e7edef; }
      text[fill="#5d6d75"], text[fill="#6b777c"] { fill: #b7c2c6; }
      [stroke="#2c3e50"] { stroke: #d7e0e3; }
      [stroke="#e0e0e0"] { stroke: #3d494f; }
    }
  </style><rect width="1200" height="630" fill="#f8f9fa" /><rect x="52" y="52" width="1096" height="526" rx="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" /><rect x="108" y="88" width="132" height="43" rx="21" fill="#eef2f3" /><text x="131" y="116" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">LIGHTING</text><text x="108" y="174" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="700">Control lights with a</text><text x="108" y="227" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="700">wireless button or</text><text x="108" y="280" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="700">linked switch</text><text x="108" y="360" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">Put a predictable physical control where it is</text><text x="108" y="391" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">useful while every light keeps a local fallback.</text><g transform="translate(705 130) scale(.82)" fill="none" stroke="#2c3e50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="70" width="112" height="210" rx="22" fill="#eef2f3" /><circle cx="56" cy="128" r="28" fill="#ffffff" /><circle cx="56" cy="222" r="28" fill="#ffffff" /><path d="M132 175h56M165 145l30 30-30 30" stroke="#7c8794" /><path d="M258 54c-44 0-77 33-77 75 0 28 15 50 34 65 12 9 17 21 17 35h52c0-14 5-26 18-35 19-15 33-37 33-65 0-42-33-75-77-75z" fill="#eef2f3" /><path d="M231 249h54M236 272h44" /><path d="M405 54c-44 0-77 33-77 75 0 28 15 50 34 65 12 9 17 21 17 35h52c0-14 5-26 18-35 19-15 33-37 33-65 0-42-33-75-77-75z" fill="#eef2f3" /><path d="M378 249h54M383 272h44" /></g><text x="108" y="550" fill="#6b777c" font-family="Segoe UI, Arial, sans-serif" font-size="20">HOME AUTOMATION COOKBOOK</text> </svg>