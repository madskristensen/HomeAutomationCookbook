<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Alert when a freezer warms up or an outbuilding loses power</title><desc id="desc">A freezer temperature sensor and separate power monitor report warming or a possible garage or shed outage.</desc><style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#f8f9fa"] { fill: #14191c; }
      rect[fill="#ffffff"], path[fill="#ffffff"] { fill: #1d2428; }
      [fill="#eef2f3"] { fill: #293238; }
      text[fill="#2c3e50"] { fill: #e7edef; }
      text[fill="#5d6d75"], text[fill="#6b777c"] { fill: #b7c2c6; }
      [stroke="#2c3e50"] { stroke: #d7e0e3; }
      [stroke="#e0e0e0"] { stroke: #3d494f; }
    }
  </style><rect width="1200" height="630" fill="#f8f9fa" /><rect x="52" y="52" width="1096" height="526" rx="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" /><rect x="108" y="88" width="269" height="43" rx="21" fill="#eef2f3" /><text x="131" y="116" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">NOTIFICATIONS</text><text x="108" y="174" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">Alert when a freezer</text><text x="108" y="225" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">warms or an outbuilding</text><text x="108" y="276" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">loses power</text><text x="108" y="356" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">Separate temperature, power, and sensor-health</text><text x="108" y="387" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">alerts so the household knows what to inspect.</text><g transform="translate(730 125) scale(.86)" fill="none" stroke="#2c3e50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="30" width="220" height="345" rx="18" fill="#eef2f3" /><path d="M0 137h220M180 75v28M180 180v28" /><path d="M306 51v202a62 62 0 1 1-62 0V51a31 31 0 0 1 62 0z" fill="#eef2f3" /><path d="M275 103v187" stroke="#7c8794" /><circle cx="275" cy="307" r="32" fill="#7c8794" stroke="none" /><path d="m361 74 24-31-5 42 29-8-38 47 7-35z" fill="#7c8794" stroke="none" /><path d="M365 153h54v98h-54zM378 251v46M406 251v46" /></g><text x="108" y="550" fill="#6b777c" font-family="Segoe UI, Arial, sans-serif" font-size="20">HOME AUTOMATION COOKBOOK</text> </svg>