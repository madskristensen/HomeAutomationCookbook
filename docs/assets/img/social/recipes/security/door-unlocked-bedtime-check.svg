  </style><rect width="1200" height="630" fill="#f8f9fa" /><rect x="52" y="52" width="1096" height="526" rx="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" /><rect x="108" y="88" width="274" height="43" rx="21" fill="#eef2f3" /><text x="131" y="116" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">SAFETY AND SECURITY</text><text x="108" y="174" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Alert when a door is</text><text x="108" y="226" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">left unlocked</text><text x="108" y="305" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">Keep unlocked status visible and check every</text><text x="108" y="336" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">exterior lock during an intentional bedtime routine.</text><g transform="translate(720 115) scale(.88)" fill="none" stroke="#2c3e50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 420V40h240v380M18 420h240" fill="#eef2f3" /><circle cx="211" cy="237" r="12" fill="#7c8794" stroke="none" /><rect x="286" y="180" width="130" height="130" rx="18" fill="#ffffff" /><path d="M317 180v-40c0-43 69-43 69 0" /><circle cx="351" cy="235" r="13" fill="#7c8794" stroke="none" /><path d="M351 248v27" /><path d="M323 65a90 90 0 0 1 85-35 94 94 0 0 0-41 70 90 90 0 0 1-44-35z" fill="#7c8794" stroke="none" /></g><text x="108" y="550" fill="#6b777c" font-family="Segoe UI, Arial, sans-serif" font-size="20">HOME AUTOMATION COOKBOOK</text> </svg>