<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Alert when a door is left unlocked and check again at bedtime</title><desc id="desc">An exterior door lock reports unlocked, prompting an alert and a separate bedtime status check.</desc><style>
