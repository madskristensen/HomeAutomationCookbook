  <text x="108" y="360" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">A speaker alarm in their room plays the</text>
  <text x="108" y="391" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">music they picked, so kids wake up on</text>
