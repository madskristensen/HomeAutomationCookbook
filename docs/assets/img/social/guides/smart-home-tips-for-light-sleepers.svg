  <text x="108" y="171" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700">Smart home tips</text>
  <text x="108" y="229" fill="#2c3e50" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="700">for light sleepers</text>
  <text x="108" y="320" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">Dim night lights, quiet alerts, and gentle</text>
  <text x="108" y="351" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">wake-ups so your smart home stops waking</text>
  <text x="108" y="382" fill="#5d6d75" font-family="Segoe UI, Arial, sans-serif" font-size="22">you. Tips for heavy sleepers too.</text>
