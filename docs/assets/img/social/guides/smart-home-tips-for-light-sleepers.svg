<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Smart home tips for light sleepers</title>
  <desc id="desc">Sleep lightly? Use dim night lights, quiet alerts, and gentle wake-ups so your smart home stops waking you. Tips for heavy sleepers too.</desc>
