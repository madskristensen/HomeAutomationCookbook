<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc"><title id="title">Washer completion notification flow</title><desc id="desc">A running cycle is first confirmed, sustained low activity is then observed, and one completion alert is sent.</desc><rect width="960" height="280" rx="16" fill="#fafafa" /><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#2c3e50"><rect x="25" y="70" width="190" height="120" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="120" y="118" font-size="20" font-weight="600">Activity rises</text><text x="120" y="151" font-size="16">power or vibration</text><rect x="265" y="70" width="190" height="120" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="360" y="118" font-size="20" font-weight="600">Mark running</text><text x="360" y="151" font-size="16">remember a real start</text><rect x="505" y="70" width="190" height="120" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="600" y="118" font-size="20" font-weight="600">Activity stays low</text><text x="600" y="151" font-size="16">longer than a pause</text><rect x="745" y="70" width="190" height="120" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="840" y="118" font-size="20" font-weight="600">Send one alert</text><text x="840" y="151" font-size="16">clear running state</text></g><g stroke="#2c3e50" stroke-width="4" fill="#2c3e50"><line x1="225" y1="130" x2="250" y2="130" /><polygon points="250,130 236,121 236,139" /><line x1="465" y1="130" x2="490" y2="130" /><polygon points="490,130 476,121 476,139" /><line x1="705" y1="130" x2="730" y2="130" /><polygon points="730,130 716,121 716,139" /></g></svg>