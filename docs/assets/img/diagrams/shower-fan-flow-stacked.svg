<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="title desc"><title id="title">Bathroom fan automation flow</title><desc id="desc">Humidity rises or the shower light turns on, the fan runs, and it stops only after humidity returns to baseline.</desc><style>@media (prefers-color-scheme: dark) { rect[fill="#fafafa"] { fill: #14191c; } rect[fill="#f8f9fa"] { fill: #1d2428; } [fill="#2c3e50"] { fill: #d7e0e3; } [stroke="#2c3e50"] { stroke: #d7e0e3; } [stroke="#e0e0e0"] { stroke: #3d494f; } }</style><rect width="360" height="464" rx="16" fill="#fafafa" /><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#2c3e50"><rect x="20" y="20" width="320" height="104" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="180" y="64" font-size="22" font-weight="600">Humidity rises</text><text x="180" y="96" font-size="18">or shower light turns on</text><rect x="20" y="180" width="320" height="104" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="180" y="224" font-size="22" font-weight="600">Fan turns on</text><text x="180" y="256" font-size="18">physical switch remains</text><rect x="20" y="340" width="320" height="104" rx="12" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="2" /><text x="180" y="384" font-size="22" font-weight="600">Humidity stays normal</text><text x="180" y="416" font-size="18">then fan turns off</text></g><g stroke="#2c3e50" stroke-width="4" fill="#2c3e50"><line x1="180" y1="132" x2="180" y2="160" /><polygon points="180,172 170,156 190,156" /><line x1="180" y1="292" x2="180" y2="320" /><polygon points="180,332 170,316 190,316" /></g></svg>