<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
</head>
<body>
    <main>
        <h1>{{ page.title }}</h1>
        <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.link_text }}</a>.</p>
    </main>
    <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
</body>
</html>
