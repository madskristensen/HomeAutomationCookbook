name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        working-directory: ${{ github.workspace }}
        run: pip install pillow pillow-avif-plugin
      - name: Install CSS minifier
        working-directory: ${{ github.workspace }}
        run: pip install rcssmin
      - name: Fingerprint image masters
        id: images
        working-directory: ${{ github.workspace }}
        run: echo "fingerprint=$(python3 script/render-image-variants.py --fingerprint)" >> "$GITHUB_OUTPUT"
      - name: Cache image variants
        uses: actions/cache@v4
        id: image-cache
        with:
          path: .image-cache
          key: image-variants-${{ steps.images.outputs.fingerprint }}
      - name: Restore image variants from cache
        if: steps.image-cache.outputs.cache-hit == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 script/render-image-variants.py --from-cache
      - name: Render image variants
        if: steps.image-cache.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: python3 script/render-image-variants.py
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
          working-directory: '${{ github.workspace }}/docs'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # github-pages runs Jekyll in safe mode and skips docs/_plugins, so
      # fingerprinting and SW shell data must run here (same pattern as
      # render-image-variants.py), not in fingerprint_assets.rb / service_worker.rb.
      - name: Fingerprint CSS/JS and write SW shell data
        working-directory: ${{ github.workspace }}
        run: python3 script/fingerprint-assets.py
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Publish capped image masters
        working-directory: ${{ github.workspace }}
        run: python3 script/render-image-variants.py --publish-site
      - name: Add IndexNow verification key
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::notice::INDEXNOW_KEY is not configured. Skipping the IndexNow verification file."
            exit 0
          fi

          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs/_site/"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Submit updated URLs to IndexNow
    runs-on: ubuntu-latest
    needs: deploy
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Skip IndexNow when not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "::notice::Add the INDEXNOW_KEY repository secret to enable IndexNow submissions."
      - name: Submit sitemap updates
        if: env.INDEXNOW_KEY != ''
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: 'https://www.homeautomationcookbook.com/sitemap.xml'
          key: ${{ env.INDEXNOW_KEY }}
          endpoint: 'api.indexnow.org'
          failure-strategy: 'error'
